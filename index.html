<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3e9" />
    <meta name="description" content="A little mystery. A house full of suspects. A family game, played together." />
    <title>Among Us at home</title>
    <!-- Apply the saved look before the app loads, so the page doesn't flash the default theme. -->
    <script>try { var theme = localStorage.getItem('home-theme'); if (theme && location.pathname !== '/print') document.documentElement.dataset.theme = theme; } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
